<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>WCCL Systems — Content Admin</title>
    <script>
      // Git Gateway lives on the authentication-only Netlify project. Keep
      // the convenient GitHub Pages /admin/ URL, but send editors to the
      // secure editor origin before Decap starts.
      if (location.hostname.endsWith("github.io")) {
        location.replace("https://wccl-systems-auth.netlify.app/admin/");
      }
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      window.WCCL_IDENTITY_URL = "https://wccl-systems-auth.netlify.app/.netlify/identity";
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({ APIUrl: window.WCCL_IDENTITY_URL });
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
  </body>
</html>
